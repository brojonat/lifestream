[tools]
claude = "latest"
claude-code = "latest"
go = "1.27"
node = "25"

[env]
_.file = { path = ".env", redact = false }

[tasks.setup]
description = "Resolve Go and agent deps, install dev tools (air)"
run = ["go mod tidy", "go install github.com/air-verse/air@latest", "cd agent && npm ci"]

[tasks.build]
description = "Build ./bin/lifestream"
run = 'go build -ldflags "-X main.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" -o bin/lifestream ./cmd/lifestream'

[tasks.test]
description = "Go tests, then agent tests (faux model; e2e against bin/lifestream)"
depends = ["build"]
run = ["go test ./...", "cd agent && npm test"]

[tasks.lint]
description = "gofmt check, go vet, agent typecheck"
run = ['test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }', "go vet ./...", "cd agent && npx tsc"]

[tasks.dev]
description = "Serve with hot reload (air), tee to logs/serve.log"
run = 'mkdir -p logs; f() { air "$@" 2>&1 | tee logs/serve.log; }; f'

[tasks.dev-agent]
description = "Run the Pi Durable agent with reload, tee to logs/agent.log"
run = 'mkdir -p logs; f() { cd agent && node --watch src/main.ts "$@" 2>&1 | tee ../logs/agent.log; }; f'

[tasks.stop]
description = "Kill whatever listens on port 8080 (an orphaned air child, usually)"
run = "kill $(lsof -nP -t -iTCP:8080 -sTCP:LISTEN) 2>/dev/null || true"

[tasks.deploy]
description = "Build images and apply k8s manifests (not set up yet, TODO 32)"
run = 'echo "deploy is not set up yet (TODO 32)" >&2; exit 1'
