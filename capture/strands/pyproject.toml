[project]
name = "lifestream-strands"
version = "0.1.0"
description = "Stream a Strands agent's messages to Lifestream as llm.message events"
authors = [
    { name = "Jon Brown", email = "brojonat@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "strands-agents>=1.61.1",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 140
