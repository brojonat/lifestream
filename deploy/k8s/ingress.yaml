# The ingest routes, public and without basic auth: Twilio signs its
# requests and /events takes a bearer token. The dashboard is
# dashboard.yaml, behind basic auth until login lands (TODO 24).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifestream
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["{{HOST}}"]
      secretName: lifestream-tls
  rules:
    - host: "{{HOST}}"
      http:
        paths:
          - path: /twilio/sms
            pathType: Exact
            backend: { service: { name: lifestream, port: { name: http } } }
          - path: /events
            pathType: Exact
            backend: { service: { name: lifestream, port: { name: http } } }
