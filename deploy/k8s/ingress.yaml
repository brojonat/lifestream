# Only the ingest routes are public. The dashboard has no login yet
# (TODO 24); reach it on the tailnet at http://lifestream (service.yaml),
# and add "/" here once login lands.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lifestream
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["{{HOST}}"]
      secretName: lifestream-tls
  rules:
    - host: "{{HOST}}"
      http:
        paths:
          - path: /twilio/sms
            pathType: Exact
            backend: { service: { name: lifestream, port: { name: http } } }
          - path: /events
            pathType: Exact
            backend: { service: { name: lifestream, port: { name: http } } }
