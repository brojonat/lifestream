{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.App}}</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 64rem; margin: 0 auto; padding: 1rem; }
  header { display: flex; gap: 1rem; align-items: baseline; margin-bottom: 1.5rem; }
  header h1 { font-size: 1.25rem; margin: 0; }
  header a { color: inherit; text-decoration: none; }
  header nav a { margin-right: 1rem; opacity: .75; }
  header .search { flex: 1; min-width: 12rem; margin-left: auto; }
  #filter button { font: inherit; font-size: .9rem; cursor: pointer; border-radius: 999px; padding: .2rem .7rem; color: inherit;
                   background: transparent; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); }
  #filter button[aria-pressed="true"] { background: color-mix(in srgb, currentColor 15%, transparent); border-color: currentColor; }
  header .search input { width: 100%; padding: .45rem .7rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  #results:not(:empty) { margin: 0 0 1.5rem; padding: .75rem 1rem; border-radius: 8px; background: color-mix(in srgb, currentColor 6%, transparent); }
  #results h2 { font-size: .85rem; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
  #results ol { margin: 0; padding-left: 1.25rem; }
  #results li { margin: .35rem 0; }
  #results li.top { font-weight: 600; }
  #results li.top .muted, #results li .muted { font-weight: 400; }
  #results .snippet { display: block; opacity: .7; font-size: .9rem; font-weight: 400; }
  h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); vertical-align: top; }
  th { font-weight: 600; font-size: .85rem; opacity: .7; }
  code { font-size: .85rem; background: color-mix(in srgb, currentColor 8%, transparent); padding: .1em .3em; border-radius: 3px; }
  .muted { opacity: .65; font-size: .9rem; }
  .row { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  button.star { background: none; border: 0; cursor: pointer; font-size: 1.25rem; line-height: 1; padding: 0 .25rem; }
  textarea, input, select { font-size: 16px; font-family: inherit; }
  textarea { width: 100%; min-height: 4rem; box-sizing: border-box; }
  .add { display: flex; gap: .5rem; margin: .75rem 0 1rem; }
  .add input { flex: 1; padding: .45rem .7rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  .add button, button.x { font: inherit; padding: .3rem .8rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; cursor: pointer; }
  button.x { border: 0; opacity: .6; }
  .note { margin: .75rem 0 1rem; }
  .note-view { cursor: text; padding: .5rem .7rem; border-radius: 6px; border: 1px dashed color-mix(in srgb, currentColor 25%, transparent); }
  .note-view:hover, .note-view:focus { border-style: solid; outline: none; }
  .note-text { white-space: pre-wrap; word-break: break-word; }
  .note-edit button { font: inherit; padding: .25rem .7rem; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; cursor: pointer; }
  .empty { padding: 2rem; text-align: center; opacity: .6; }
                background: color-mix(in srgb, currentColor 10%, Canvas); border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
  /* dataviz roles: reference palette, light then dark */
  .viz-root { --series-1: #2a78d6; --ink-muted: #898781; --baseline: #c3c2b7; --status-good: #0ca30c; --status-warning: #fab219; --status-critical: #d03b3b; --track: #cde2fb; }
  @media (prefers-color-scheme: dark) { .viz-root { --series-1: #3987e5; --baseline: #383835; --track: #0d366b; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .75rem; margin: 1rem 0; }
  .tile { padding: .75rem .9rem; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .tile.over { border-color: var(--status-critical); }
  .tile .label { font-size: .85rem; opacity: .7; }
  .tile .value { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin: .1rem 0 .3rem; }
  .tile .unit { font-size: .85rem; font-weight: 400; opacity: .7; margin-left: .15rem; }
  .spark { display: block; overflow: visible; }
  .spark .line { fill: none; stroke: var(--ink-muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .base { stroke: var(--baseline); stroke-width: 1; }
  .spark .now { fill: var(--series-1); }
  .spark .hit { fill: transparent; }
  .spark .hit:hover { fill: color-mix(in srgb, currentColor 8%, transparent); }
  .threshold { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; font-size: .85rem; }
  .threshold label { display: flex; align-items: center; gap: .35rem; }
  .threshold input { width: 5.5rem; padding: .2rem .4rem; border-radius: 4px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  .tile { display: flex; flex-direction: column; }
  .status { white-space: nowrap; text-align: center; margin-top: .5rem; font-size: .85rem; }
  .status.critical { color: var(--status-critical); }
  .status.good { color: color-mix(in srgb, var(--status-good) 85%, currentColor); }
  .meters { display: grid; gap: .6rem; margin: 1rem 0 1.5rem; }
  .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; background: var(--series-1); border-radius: 4px; }
  .fill.warning { background: var(--status-warning); }
  .fill.critical { background: var(--status-critical); }
            color: inherit; background: color-mix(in srgb, currentColor 10%, Canvas); border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
</style>
</head>
<body data-init="@get('{{.StreamURL}}', {openWhenHidden: true})">
<header>
  <h1><a href="/">{{.App}}</a></h1>
  <nav><a href="/">items</a><a href="/admin">diagnostics</a></nav>
  {{template "filter" .}}
  <form class="search" role="search" data-on:submit="@get('/search')">
    <input type="search" name="q" autocomplete="off" placeholder="Search items" aria-label="Search items"
           data-bind:q
           data-on:input__debounce.300ms="@get('/search')"
           data-on:keydown="evt.key === 'Escape' && ($q = '', @get('/search'))">
  </form>
</header>
{{template "results" .}}
{{template "region" .}}
</body>
</html>
{{end}}
