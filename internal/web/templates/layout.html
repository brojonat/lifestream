{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · {{.App}}</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- datastar-rocket.js is the full Datastar bundle plus Rocket (web
     components); it replaces datastar.js. Pinned versions, no build step. -->
<script type="importmap">
{"imports": {
  "datastar": "https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.4/bundles/datastar-rocket.js",
  "d3": "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm"
}}
</script>
<script type="module" src="/static/components.js"></script>
<style>
  /* Reference dataviz palette (validated); dark steps selected, not flipped. */
  :root { color-scheme: light dark;
          --surface: #fcfcfb; --ink: #1d1d1b; --ink-muted: #6e6d68; --baseline: #c3c2b7; --grid: #e7e6df;
          --cat-1: #2a78d6; --cat-2: #eb6834; --series-1: #2a78d6;
          --status-good: #0ca30c; --status-warning: #fab219; --status-critical: #d03b3b; --track: #cde2fb; }
  @media (prefers-color-scheme: dark) {
    :root { --surface: #1a1a19; --ink: #e9e8e3; --ink-muted: #a3a29b; --baseline: #383835; --grid: #2a2a28;
            --cat-1: #3987e5; --cat-2: #d95926; --series-1: #3987e5; --track: #0d366b; } }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 64rem; margin: 0 auto; padding: 1rem;
         background: var(--surface); color: var(--ink); }
  header { display: flex; gap: 1.25rem; align-items: baseline; flex-wrap: wrap; margin-bottom: 1.25rem; }
  header h1 { font-size: 1.25rem; margin: 0; }
  header a { color: inherit; text-decoration: none; }
  header nav { display: flex; gap: 1rem; flex-wrap: wrap; }
  header nav a { opacity: .7; }
  header nav a[aria-current] { opacity: 1; font-weight: 600; }
  h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); vertical-align: top; }
  th { font-weight: 600; font-size: .85rem; color: var(--ink-muted); }
  td.num, th.num { text-align: right; }
  code { font-size: .85rem; background: color-mix(in srgb, currentColor 8%, transparent); padding: .1em .3em; border-radius: 3px; }
  .muted { color: var(--ink-muted); font-size: .9rem; }
  .row { display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap; }
  .empty { padding: 2rem 1rem; text-align: center; color: var(--ink-muted); }
  textarea, input, select, button { font-size: 16px; font-family: inherit; }

  /* metrics */
  .card { padding: 1rem 0 1.5rem; border-bottom: 1px solid color-mix(in srgb, currentColor 10%, transparent); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: .75rem; margin: .75rem 0; }
  .tile { padding: .75rem .9rem; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  .tile .label { font-size: .85rem; color: var(--ink-muted); }
  .tile .value { font-size: 1.6rem; font-weight: 600; line-height: 1.2; margin: .1rem 0 .2rem; font-variant-numeric: tabular-nums; }
  .tile .unit { font-size: .85rem; font-weight: 400; color: var(--ink-muted); margin-left: .2rem; }
  details { margin-top: .5rem; }
  summary { cursor: pointer; color: var(--ink-muted); font-size: .9rem; }

  /* inbox */
  .status { display: inline-block; font-size: .8rem; padding: .05rem .5rem; border-radius: 999px; white-space: nowrap;
            border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
  tr.flagged { background: color-mix(in srgb, var(--status-warning) 12%, transparent); }
  .status.flagged { border-color: var(--status-warning); }
  .chip { display: inline-block; font-size: .85rem; padding: 0 .45rem; margin: 0 .25rem .2rem 0; border-radius: 4px;
          background: color-mix(in srgb, var(--cat-1) 14%, transparent); }
  .text { white-space: pre-wrap; word-break: break-word; }
  h3 { font-size: 1rem; margin: 1.25rem 0 .4rem; }
  a { color: inherit; }
  ol.history { padding-left: 1.25rem; margin: 0; }
  ol.history li { margin: .2rem 0; }
  button.quiet, details.add summary { font-size: .85rem; padding: .1rem .55rem; border-radius: 6px; cursor: pointer; color: inherit;
    background: transparent; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
  details.add { display: inline-block; margin: 0; }
  details.add summary { display: inline-block; list-style: none; }
  details.add form { display: flex; gap: .4rem; margin-top: .35rem; }
  details.add select { padding: .15rem .3rem; border-radius: 6px; background: transparent; color: inherit;
    border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
  @media (max-width: 640px) {
    table.inbox thead { display: none; }
    table.inbox tr { display: grid; grid-template-columns: 1fr auto; gap: .25rem .75rem; padding: .6rem .5rem;
                     border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    table.inbox td { border: 0; padding: 0; }
    table.inbox td.state { grid-column: 2; grid-row: 1; text-align: right; }
    table.inbox td.text, table.inbox td.became { grid-column: 1 / -1; }
    table.inbox td.became:empty { display: none; }
  }

  /* diagnostics (template admin page) */
  .viz-root { --series-1: var(--cat-1); }
  .tile.over { border-color: var(--status-critical); }
  .spark { display: block; overflow: visible; }
  .spark .line { fill: none; stroke: var(--ink-muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .spark .base { stroke: var(--baseline); stroke-width: 1; }
  .spark .now { fill: var(--series-1); }
  .spark .hit { fill: transparent; }
  .spark .hit:hover { fill: color-mix(in srgb, currentColor 8%, transparent); }
  .threshold { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; font-size: .85rem; }
  .threshold label { display: flex; align-items: center; gap: .35rem; }
  .threshold input { width: 5.5rem; padding: .2rem .4rem; border-radius: 4px; border: 1px solid color-mix(in srgb, currentColor 30%, transparent); background: transparent; color: inherit; }
  .tile { display: flex; flex-direction: column; }
  .tile .status { text-align: center; margin-top: .5rem; border: 0; }
  .status.critical { color: var(--status-critical); }
  .status.good { color: color-mix(in srgb, var(--status-good) 85%, currentColor); }
  .meters { display: grid; gap: .6rem; margin: 1rem 0 1.5rem; }
  .track { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .fill { height: 100%; background: var(--series-1); border-radius: 4px; }
  .fill.warning { background: var(--status-warning); }
  .fill.critical { background: var(--status-critical); }
</style>
</head>
<body data-init="@get('{{.StreamURL}}', {openWhenHidden: true})">
<header>
  <h1><a href="/">{{.App}}</a></h1>
  <nav>
    <a href="/" {{if eq .Nav "metrics"}}aria-current="page"{{end}}>metrics</a>
    <a href="/inbox" {{if eq .Nav "inbox"}}aria-current="page"{{end}}>inbox</a>
    <a href="/collections" {{if eq .Nav "collections"}}aria-current="page"{{end}}>collections</a>
    <a href="/admin" {{if eq .Nav "admin"}}aria-current="page"{{end}}>diagnostics</a>
  </nav>
</header>
{{template "region" .}}
</body>
</html>
{{end}}
